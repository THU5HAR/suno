services:
  - type: web
    name: playlist-studio-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is automatically set by Render, no need to specify
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/playlist-studio.db
      - key: ALLOWED_ORIGINS
        value: https://thu5har.github.io,https://suno-rho.vercel.app,https://music-video-gen.onrender.com,http://localhost:5173,http://localhost:3000
      - key: MAX_FILE_SIZE
        value: 104857600
      - key: UPLOAD_DIR
        value: ./uploads

