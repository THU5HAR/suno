services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playlist-studio-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:80,http://localhost:3000,http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - playlist-studio-network

  frontend:
    build:
      context: ./playlist-studio-react
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3001
    container_name: playlist-studio-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - playlist-studio-network

networks:
  playlist-studio-network:
    driver: bridge

